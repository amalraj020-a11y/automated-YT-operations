name: Amala YouTube Short every 2 hours

on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish publicly to YouTube"
        type: boolean
        required: true
        default: false
      artifact_run_id:
        description: "Optional reviewed workflow run ID to publish exactly"
        type: string
        required: false
        default: ""

concurrency:
  group: amala-youtube-every-two-hours
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  create-short:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_MODEL: qwen/qwen3.8-27b
      VIDEO_RENDERER: moneyprinter
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
      GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
      GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
      GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install free media tools
        run: sudo apt-get update && sudo apt-get install -y espeak-ng ffmpeg fonts-dejavu-core
      - name: Install Python packages
        run: pip install -r requirements.txt mpt==1.3.9
      - name: Generate, validate and publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ -n "${{ inputs.artifact_run_id }}" ]]; then
            if [[ "${{ inputs.publish }}" != "true" ]]; then
              echo "Publishing a reviewed artifact requires publish=true" >&2
              exit 2
            fi
            gh run download "${{ inputs.artifact_run_id }}" --repo "${{ github.repository }}" --dir reviewed-artifact
            video="$(find reviewed-artifact -name amala-short.mp4 -type f -print -quit)"
            content="$(find reviewed-artifact -name content.json -type f -print -quit)"
            test -n "$video" && test -n "$content"
            python scripts/hourly_cloud.py --publish --existing-video "$video" --content-file "$content" --output publish-output
          elif [[ "${{ github.event_name }}" == "schedule" || "${{ inputs.publish }}" == "true" ]]; then
            python scripts/hourly_cloud.py --publish
          else
            python scripts/hourly_cloud.py
          fi
      - name: Export Excel report
        if: always()
        run: python scripts/export_operations_report.py --output hourly-output --workbook reports/latest/amala-operations.xlsx
      - name: Upload Excel report to Google Drive
        if: always()
        env:
          AMALA_WORKBOOK: reports/latest/amala-operations.xlsx
          AMALA_DRIVE_STATUS: reports/latest/drive-upload.json
        run: python scripts/upload_drive_report.py
      - name: Commit Excel report to GitHub
        if: always()
        shell: bash
        run: |
          if [[ -f reports/latest/amala-operations.xlsx ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add reports/latest/amala-operations.xlsx reports/latest/drive-upload.json
            git diff --cached --quiet || git commit -m "Update Amala operations report [skip ci]"
            git push
          fi
      - name: Save evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: amala-hourly-${{ github.run_id }}
          path: |
            hourly-output/
            publish-output/
          retention-days: 3
          if-no-files-found: warn
